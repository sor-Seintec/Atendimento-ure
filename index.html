  <style>
    :root { --navy:#132238; --blue:#2864d7; --blue-soft:#eaf1ff; --ink:#1b2638; --muted:#6b778c; --line:#e3e8f0; --bg:#f5f7fb; --green:#1b9b73; --amber:#d58b16; --red:#d75252; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }

    aside { background:var(--navy); color:#dfe7f7; padding:26px 18px; display:flex; flex-direction:column; gap:28px; }
    .brand { display:flex; gap:12px; align-items:center; padding:0 10px; }

    .brand strong { display:block; font-size:16px; color:#fff; } .brand small { color:#9eacc6; }
    nav { display:grid; gap:7px; }
    nav button { text-align:left; background:transparent; color:#b9c5da; padding:12px 14px; border-radius:10px; font-weight:600; }
    nav button.active, nav button:hover { background:#203555; color:#fff; }
    .side-note { margin-top:auto; padding:14px; border:1px solid #304361; border-radius:12px; color:#aebbd1; font-size:12px; line-height:1.5; }
    main { padding:28px 34px 48px; max-width:1500px; width:100%; margin:auto; }
    .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px; }
    h1 { margin:0 0 6px; font-size:28px; letter-spacing:-.5px; } h2 { margin:0; font-size:18px; } p { margin:0; color:var(--muted); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .btn { padding:11px 15px; border-radius:9px; font-weight:700; background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); } .btn.danger { color:#b84343; }
    .page { display:none; } .page.active { display:block; }
    .cards { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:24px; }
    .card, .panel { background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 18px rgba(26,45,78,.035); }
    .card { padding:18px 20px; } .label { color:var(--muted); font-size:13px; font-weight:600; } .metric { font-size:30px; font-weight:800; margin-top:8px; } .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .panel { padding:22px; margin-bottom:20px; } .panel-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    #page-relatorios > .cards .card:nth-child(2), #page-relatorios > .panel:last-child { display:none; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; } .field { grid-column:span 3; } .field.wide { grid-column:span 6; } .field.full { grid-column:1/-1; }
    label { display:block; font-size:12px; font-weight:800; color:#536076; margin-bottom:7px; } input, select, textarea { width:100%; border:1px solid #d6deea; border-radius:8px; padding:11px 12px; outline:none; background:#fff; color:var(--ink); } input:focus, select:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #dce7ff; } textarea { min-height:82px; resize:vertical; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    .filters { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:10px; align-items:end; }
    .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:900px; } th { color:#738099; font-size:11px; text-transform:uppercase; letter-spacing:.04em; text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); } td { padding:14px 12px; border-bottom:1px solid #edf0f5; font-size:13px; vertical-align:top; } tr:hover td { background:#fbfcff; }
    .status { display:inline-flex; align-items:center; padding:5px 9px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; } .status.open { color:#ad6a07; background:#fff4db; } .status.done { color:#087a57; background:#def7ed; } .status.progress { color:#255bb4; background:#e6efff; } .status.cancel { color:#a84141; background:#ffe5e5; }
    .row-actions { display:flex; gap:6px; } .icon-btn { padding:6px 8px; border-radius:7px; background:#f1f4f9; color:#506078; font-size:12px; } .icon-btn:hover { background:#e4eafb; }
    .report-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; } .bar-row { display:grid; grid-template-columns:150px 1fr 44px; gap:10px; align-items:center; margin:13px 0; font-size:13px; } .bar-bg { height:10px; background:#edf1f6; border-radius:99px; overflow:hidden; } .bar { height:100%; background:var(--blue); border-radius:99px; }
    .empty { text-align:center; padding:34px 10px; color:var(--muted); } .toast { position:fixed; right:24px; bottom:24px; background:var(--navy); color:#fff; padding:13px 17px; border-radius:9px; opacity:0; transform:translateY(10px); pointer-events:none; transition:.2s; } .toast.show { opacity:1; transform:translateY(0); } .auth-screen { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:20; } .auth-box { width:min(390px,calc(100% - 32px)); background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 12px 32px rgba(26,45,78,.1); } .auth-box h1 { font-size:22px; } .auth-box .btn { width:100%; margin-top:14px; } .auth-error { color:var(--red); font-size:13px; min-height:18px; margin-top:10px; } .user-actions { display:flex; align-items:center; gap:10px; } .user-email { color:var(--muted); font-size:12px; }
    .modal { display:none; position:fixed; inset:0; background:rgba(10,19,35,.45); place-items:center; padding:20px; z-index:5; } .modal.open { display:grid; } .modal-box { width:min(560px,100%); background:white; border-radius:15px; padding:24px; }
    @media(max-width:1000px){ .app{grid-template-columns:1fr;} aside{padding:14px; flex-direction:row; align-items:center; gap:12px;} nav{display:flex; overflow:auto;} nav button{white-space:nowrap;} .side-note{display:none;} main{padding:24px 16px;} .cards{grid-template-columns:repeat(2,1fr);} .filters{grid-template-columns:1fr 1fr;} .report-grid{grid-template-columns:1fr;} }

<body>
  <div class="auth-screen" id="auth-screen"><form class="auth-box" id="login-form"><h1>Atendimentos SEINTEC</h1><p style="margin:8px 0 20px">Entre para acessar os chamados.</p><label for="login-email">Usuário</label><input id="login-email" autocomplete="username" placeholder="admin ou e-mail" required><label for="login-password" style="margin-top:12px">Senha</label><input id="login-password" type="password" autocomplete="current-password" required><div class="auth-error" id="auth-error"></div><button class="btn primary" type="submit">Entrar</button></form></div>

      <section class="page active" id="page-dashboard"><div class="cards"><div class="card"><div class="label">Total de chamados</div><div class="metric" id="total-metric">0</div><div class="hint">registros cadastrados</div></div><div class="card"><div class="label">Em aberto</div><div class="metric" id="open-metric">0</div><div class="hint">aguardando atendimento</div></div><div class="card"><div class="label">Concluídos</div><div class="metric" id="done-metric">0</div><div class="hint">atendimentos finalizados</div></div><div class="card"><div class="label">Neste mês</div><div class="metric" id="month-metric">0</div><div class="hint">chamados registrados</div></div></div><div class="panel"><div class="panel-header"><div><h2>Últimos chamados</h2><p style="margin-top:4px">Acompanhe os registros mais recentes.</p></div><button class="btn" data-go="chamados">Ver todos</button></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Atividade</th><th>Escola / URE</th><th>Status</th></tr></thead><tbody id="recent-body"></tbody></table></div></div></section>

      <section class="page" id="page-chamados"><div class="panel" id="form-panel"><div class="panel-header"><div><h2 id="form-title">Registrar chamado</h2><p style="margin-top:4px">Preencha os dados do atendimento.</p></div><button class="btn" id="cancel-edit" style="display:none">Cancelar edição</button></div><form id="call-form"><div class="grid"><div class="field"><label for="date">Data *</label><input id="date" type="date" required></div><div class="field"><label for="school">Atendimento escola</label><input id="school" list="schools" placeholder="Nome da escola"><datalist id="schools"></datalist></div><div class="field"><label for="ure">Atendimento URE</label><select id="ure"><option value="">Selecione uma opção</option><option>ESE</option><option>SEGRE</option><option>ASURE</option><option>SEOM</option><option>SEMAT</option><option>SEFREP</option><option>COEGD</option><option>SEPES</option><option>SEVESC</option><option>SEFISC</option><option>SETEC</option><option>SEINTEC</option><option>SEFIN</option><option>SEAPE</option><option>EEC</option></select></div><div class="field"><label for="activity">Atividade *</label><select id="activity" required><option value="">Selecione uma opção</option><option>Chamado Aberto Linha Telefônica</option><option>Chamado Aberto Link Intragov</option><option>Publicações no Site Editais e Atribuição</option><option>Atendimento Interno</option><option>Publicações no Site</option><option>Espelhamento de Câmeras</option><option>Reunião de Chefe de Serviço</option><option>Verificação de Infraestrutura</option><option>Visita Técnica - Presencial</option><option>Chamado Aberto de Infraestrutura</option><option>Chamado Aberto departamento</option><option>SDWAN</option><option>Reunião Gestão Digital COEGD</option><option>Equipamentos realizado reparo</option><option>Reunião de Chefe de Serviço com a Dirigente</option><option>Verificação de Conectividade</option><option>Publicações no Site Editais, Atribuição</option><option>Chamado Aberto VOIP</option><option>Equipamentos remanejados</option><option>Podcast</option><option>Manutenção de Equipamentos</option><option>Treinamento Presencial</option><option>Verificação de AP</option></select></div><div class="field"><label for="quantity">Quantidade</label><input id="quantity" type="number" min="0" step="1" value="1"></div><div class="field"><label for="status">Status *</label><select id="status" required><option>Aberto</option><option>Em andamento</option><option>Concluído</option><option>Cancelado</option></select></div><div class="field wide"><label for="request">Solicitação / problema identificado *</label><input id="request" placeholder="Descreva a solicitação" required></div><div class="field wide"><label for="action">Providências / encaminhamentos</label><input id="action" placeholder="Informe o que foi feito ou encaminhado"></div></div><div class="form-actions"><button class="btn" type="reset">Limpar</button><button class="btn primary" type="submit">Salvar chamado</button></div></form></div><div class="panel"><div class="panel-header"><div><h2>Consulta de chamados</h2><p style="margin-top:4px">Filtre, edite ou remova registros.</p></div><span class="label" id="result-count">0 registros</span></div><div class="filters"><div><label>Buscar</label><input id="search" placeholder="Escola, atividade, solicitação..."></div><div><label>Status</label><select id="filter-status"><option value="">Todos</option><option>Aberto</option><option>Em andamento</option><option>Concluído</option><option>Cancelado</option></select></div><div><label>Data inicial</label><input id="filter-from" type="date"></div><div><label>Data final</label><input id="filter-to" type="date"></div><button class="btn" id="clear-filters">Limpar filtros</button></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>Data</th><th>Escola</th><th>URE</th><th>Atividade</th><th>Solicitação</th><th>Providências</th><th>Status</th><th></th></tr></thead><tbody id="calls-body"></tbody></table></div></div></section>

      <section class="page" id="page-relatorios"><div class="panel"><div class="panel-header"><div><h2>Período do relatório</h2><p style="margin-top:4px">Filtre os indicadores por dia, mês e ano.</p></div><button class="btn" id="clear-report-filters">Limpar filtros</button></div><div class="filters" style="grid-template-columns:1fr 1fr 1fr auto"><div><label>Dia</label><select id="report-day"><option value="">Todos os dias</option><option value="01">1</option><option value="02">2</option><option value="03">3</option><option value="04">4</option><option value="05">5</option><option value="06">6</option><option value="07">7</option><option value="08">8</option><option value="09">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select></div><div><label>Mês</label><select id="report-month"><option value="">Todos os meses</option><option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option></select></div><div><label>Ano</label><select id="report-year"><option value="">Todos os anos</option></select></div></div></div><div class="cards"><div class="card"><div class="label">Quantidade registrada</div><div class="metric" id="qty-metric">0</div><div class="hint">soma dos atendimentos</div></div><div class="card"><div class="label">Taxa de conclusão</div><div class="metric" id="rate-metric">0%</div><div class="hint">sobre o total de chamados</div></div></div><div class="report-grid"><div class="panel"><div class="panel-header"><div><h2>Chamados por status</h2><p style="margin-top:4px">Distribuição dos registros.</p></div></div><div id="status-report"></div></div><div class="panel"><div class="panel-header"><div><h2>Principais atividades</h2><p style="margin-top:4px">Atividades com mais registros.</p></div></div><div id="activity-report"></div></div></div><div class="panel"><div class="panel-header"><div><h2>Relatório mensal</h2><p style="margin-top:4px">Quantidade de chamados por mês.</p></div></div><div id="month-report"></div></div></section>
    </main>
  </div>
  </template>

  <script>
  (() => {
    'use strict';
    let calls=[]; let editId=null;
    const SCHOOL_OPTIONS=['ACCÁCIO DE VASCONCELLOS CAMARGO - Prof.','AGGÊO PEREIRA DO AMARAL - Prof.','ALTAMIR GONÇALVES - Prof.','AMÉLIA CÉSAR MACHADO DE ARAÚJO - Profª.','ANA CECÍLIA MARTINS - Profª.','ANTONIA LUCCHESI - Profª.','ANTONIO CORDEIRO - Prof.','ANTONIO MIGUEL PEREIRA JÚNIOR','ANTONIO PADILHA','ANTONIO VIEIRA CAMPOS','ARQUÍMINIO MARQUES DA SILVA - Prof.','ARTHUR CYRILLO FREIRE - Dr.','BALTAZAR FERNANDES','BEATHRIS CAIXEIRO DEL CISTIA - Profª.','CEEJA NORBERTO SOARES RAMOS - Prof.','DIÓGENES ALMEIDA MARINS - Prof.','DIONYSIO VIEIRA - Prof.','DULCE ESMERALDA BASILE FERREIRA - Profª.','ELZA SALVESTRO BONILHA - Profª.','ELZIDE CELESTINA SOUZA P. TUNUCHI Profª','ENÉAS PROENÇA DE ARRUDA - Prof.','ESCOLÁSTICA ROSA DE ALMEIDA - Profª.','EZEQUIEL MACHADO NASCIMENTO - Prof.','FERNANDA DE CAMARGO PIRES - Profª','FLÁVIO GAGLIARDI - Prof.','FRANCISCO CAMARGO CÉSAR','FRANCISCO COCCARO - Prof.','FRANCISCO EUFRÁSIO MONTEIRO','GENÉSIO MACHADO - Prof.','GENÉZIA ISABEL CARDOSO MENCACCI - Profª.','GERALDO DO ESPIRITO S. FOGAÇA ALMEIDA Prof.','GUALBERTO MOREIRA - Dr.','GUIOMAR CAMOLESI SOUZA - Profª.','GUMERCINDO GONÇALVES','HÉLIO DEL CISTIA','HUMBERTO DE CAMPOS','IDA YOLANDA LANZONI DE BARROS - Profª.','ISABEL LOPES MONTEIRO - Profª.','IZABEL RODRIGUES GALVÃO - Profª.','JOÃO CLIMACO DE CAMARGO PIRES','JOÃO MACHADO DE ARAÚJO - Dr.','JOÃO RODRIGUES BUENO','JOÃO SOARES - Monsenhor','JOAQUIM IZIDORO MARINS - Prof.','JORDINA AMARAL ARRUDA - Profª.','JORGE MADUREIRA - Prof.','JOSÉ ODIN DE ARRUDA - Prof.','JOSÉ QUEVEDO - Prof.','JOSÉ REGINATO - Prof.','JOSÉ ROQUE DE ALMEIDA ROSA - Prof.','JÚLIA RIOS ATHAYDE - Profª.','JÚLIO BIERRENBACH LIMA - Prof.','JÚLIO PRESTES DE ALBUQUERQUE - Dr.','LAILA GALEP SACKER - Prof.','LAURO SANCHEZ - Prof.','LUIZ GONZAGA DE CAMARGO FLEURY - Prof.','LUIZ NOGUEIRA MARTINS - Senador','MARCO ANTONIO MENCACCI - Prof.','MARIA CÂNDIDA DE BARROS ARAÚJO - Profª.','MARIA HELENA GAZZI BONADIO PROFª','MARIA ONDINA DE ANDRADE Profª','MARINA GROHMANN SOARES FERNA     function fillSchools(){$('#schools').innerHTML=SCHOOL_OPTIONS.map(s=>'<option value="'+esc(s)+'"></option>').join('')} function sortActivities(){const select=$('#activity'),labels={'Chamado Aberto de Infraestrutura':'Infraestrutura de Rede','Chamado Aberto departamento':'Departamentos','Chamado Aberto Linha Telefônica':'Linha Telefônica','Chamado Aberto Link Intragov':'Link Intragov','Chamado Aberto VOIP':'Voip','Reunião de Chefe de Serviço com a Dirigente':'Reunião com o Dirigente'};[...select.options].forEach(option=>{if(option.text.startsWith('Publicações no Site Editais')||option.text==='Equipamentos realizado reparo')option.remove();else if(labels[option.text]){option.text=labels[option.text];option.value=labels[option.value]||option.text}});const options=[...select.options].slice(1).sort((a,b)=>a.text.localeCompare(b.text,'pt-BR',{sensitivity:'base'}));options.forEach(option=>select.appendChild(option))}
    const firebaseConfig={apiKey:'AIzaSyAskuGsiapM13KKENlwIcSRjhMvTu9ntyA',authDomain:'atendimentos-ure.firebaseapp.com',projectId:'atendimentos-ure',storageBucket:'atendimentos-ure.firebasestorage.app',messagingSenderId:'781558238833',appId:'1:781558238833:web:13997a2cab6928f87355d0'}; firebase.initializeApp(firebaseConfig); const auth=firebase.auth(),firestore=firebase.firestore(),callsRef=firestore.collection('calls'),LOGIN_ALIASES={admin:'desornit@prof.educacao.sp.gov.br'}; function resolveLogin(value){const key=String(value||'').trim().toLowerCase();return LOGIN_ALIASES[key]||key}
    function $(s){return document.querySelector(s)} function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))} function norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()} function dateLabel(v){if(!v)return '-';const d=new Date(v+'T00:00:00');return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR')} function statusClass(v){const n=norm(v);return n.includes('concl')?'done':n.includes('andamento')?'progress':n.includes('cancel')?'cancel':'open'} function badge(v){return '<span class="status '+statusClass(v)+'">'+esc(v||'Aberto')+'</span>'}
    function filtered(){const q=norm($('#search').value),s=norm($('#filter-status').value),f=$('#filter-from').value,t=$('#filter-to').value;return calls.filter(c=>(!q||[c.school,c.ure,c.activity,c.request,c.action].some(x=>norm(x).includes(q)))&&(!s||norm(c.status)===s)&&(!f||c.date>=f)&&(!t||c.date<=t)).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
    function reportData(){const d=$('#report-day').value,m=$('#report-month').value,y=$('#report-year').value;return calls.filter(c=>{const p=String(c.date||'').split('-');return(!d||p[2]===d)&&(!m||p[1]===m)&&(!y||p[0]===y)})}
    function fillYears(){const old=$('#report-year').value,ys=[...new Set(calls.map(c=>String(c.date||'').slice(0,4)).filter(Boolean))].sort().reverse();$('#report-year').innerHTML='<option value="">Todos os anos</option>'+ys.map(y=>'<option value="'+esc(y)+'">'+esc(y)+'</option>').join('');if(ys.includes(old))$('#report-year').value=old}
    function bars(data,target,total){if(!data.length){$(target).innerHTML='<div class="empty">Sem dados para exibir.</div>';return}const max=Math.max(...data.map(x=>x[1]));$(target).innerHTML=data.map(x=>'<div class="bar-row"><span>'+esc(x[0])+'</span><div class="bar-bg"><div class="bar" style="width:'+Math.max(3,x[1]/max*100)+'%"></div></div><strong>'+x[1]+'</strong></div>').join('')}
    function renderReports(){if(!sessionReady())return;const data=reportData(),total=data.length;$('#qty-metric').textContent=data.reduce((a,c)=>a+(Number(c.quantity)||0),0);$('#rate-metric').textContent=total?Math.round(data.filter(c=>statusClass(c.status)==='done').length/total*100)+'%':'0%';const count=k=>Object.entries(data.reduce((a,c)=>(a[c[k]||'Sem informação']=(a[c[k]||'Sem informação']||0)+1,a),{})).sort((a,b)=>b[1]-a[1]);bars(count('status'),'#status-report',total);bars(count('activity').slice(0,8),'#activity-report',total);const months=Object.entries(data.reduce((a,c)=>{const m=c.date?c.date.slice(0,7):'Sem data';a[m]=(a[m]||0)+1;return a},Object.create(null))).sort();bars(months,'#month-report',total)}
    function render(){if(!sessionReady())return;fillYears();const total=calls.length,open=calls.filter(c=>statusClass(c.status)==='open').length,done=calls.filter(c=>statusClass(c.status)==='done').length,now=new Date(),month=calls.filter(c=>{const d=new Date(c.date+'T00:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;$('#total-metric').textContent=total;$('#open-metric').textContent=open;$('#done-metric').textContent=done;$('#month-metric').textContent=month;const recent=[...calls].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);$('#recent-body').innerHTML=recent.length?recent.map(c=>'<tr><td>'+dateLabel(c.date)+'</td><td><strong>'+esc(c.activity)+'</strong><br><small>'+esc(c.request)+'</small></td><td>'+esc(c.school||c.ure||'-')+'</td><td>'+badge(c.status)+'</td></tr>').join(''):'<tr><td colspan="4"><div class="empty">Nenhum chamado cadastrado.</div></td></tr>';const list=filtered();$('#result-count').textContent=list.length+' registro'+(list.length===1?'':'s');$('#calls-body').innerHTML=list.length?list.map(c=>'<tr><td>'+dateLabel(c.date)+'</td><td>'+esc(c.school||'-')+'</td><td>'+esc(c.ure||'-')+'</td><td>'+esc(c.activity)+'</td><td>'+esc(c.request)+'</td><td>'+esc(c.action||'-')+'</td><td><span class="status '+statusClass(c.status)+'" data-status-id="'+esc(c.id)+'">'+esc(c.status||'Aberto')+'</span></td><td><div class="row-actions"><button class="icon-btn" data-edit-id="'+esc(c.id)+'">Editar</button><button class="icon-btn" data-delete-id="'+esc(c.id)+'">Excluir</button></div></td></tr>').join(''):'<tr><td colspan="8"><div class="empty">Nenhum resultado encontrado.</div></td></tr>';renderReports()}
    function resetForm(){editId=null;$('#call-form').reset();$('#date').value=new Date().toISOString().slice(0,10);$('#quantity').value=1;$('#form-title').textContent='Registrar chamado';$('#cancel-edit').style.display='none'} function editCall(id){if(!sessionReady())return;const c=calls.find(x=>x.id===id);if(!c)return;editId=id;['date','school','ure','activity','quantity','status','request','action'].forEach(k=>$('#'+k).value=c[k]??'');$('#form-title').textContent='Editar chamado';$('#cancel-edit').style.display='inline-block';showPage('chamados');scrollTo({top:0,behavior:'smooth'})} function editStatus(id,element){if(!sessionReady())return;const current=calls.find(x=>x.id===id);if(!current)return;const select=document.createElement('select');select.className='status '+statusClass(current.status);['Aberto','Em andamento','Concluído','Cancelado'].forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;option.selected=norm(value)===norm(current.status);select.appendChild(option)});select.ondblclick=event=>event.stopPropagation();select.onchange=()=>commitStatus(id,select);select.onblur=()=>{if(select.isConnected)render()};element.replaceWith(select);select.focus()}
    function showPage(p){if(!sessionReady())return;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('#page-'+p).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p))}
    function bindPortal(){
    document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('#new-btn').onclick=()=>{showPage('chamados');resetForm()};$('#cancel-edit').onclick=resetForm;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showPage(b.dataset.go));['search','filter-from','filter-to'].forEach(id=>$('#'+id).addEventListener('input',render));$('#filter-status').addEventListener('change',render);$('#clear-filters').onclick=()=>{['search','filter-from','filter-to'].forEach(id=>$('#'+id).value='');$('#filter-status').value='';render()};['report-day','report-month','report-year'].forEach(id=>$('#'+id).onchange=renderReports);$('#clear-report-filters').onclick=()=>{['report-day','report-month','report-year'].forEach(id=>$('#'+id).value='');renderReports()}
    $('#export-btn').onclick=()=>{if(!sessionReady())return;const rows=calls.map(c=>({'DATA':c.date,'ATENDIMENTO ESCOLA':c.school,'ATENDIMENTO URE':c.ure,'ATIVIDADE':c.activity,'Quantidade':Number(c.quantity)||0,'SOLICITAÇÃO / PROBLEMAS IDENTIFICADOS':c.request,'PROVIDÊNCIAS / ENCAMINHAMENTOS':c.action,'STATUS':c.status}));if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ATENDIMENTOS');XLSX.writeFile(wb,'relatorio-chamados-ure.xlsx')}}
    $('#call-form').addEventListener('reset',()=>setTimeout(()=>{const q=$('#quantity');if(q)q.value=1},0));
    $('#call-form').onsubmit=async e=>{
      e.preventDefault(); if(!sessionReady())return;
      const c={id:editId||crypto.randomUUID(),date:$('#date').value,school:$('#school').value.trim(),ure:$('#ure').value,activity:$('#activity').value,quantity:$('#quantity').value,request:$('#request').value.trim(),action:$('#action').value.trim(),status:$('#status').value};
      try { if(await save(c))resetForm(); } catch(error){reportError(error);}
    };
    $('#calls-body').addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b||!sessionReady())return;
      if(b.hasAttribute('data-edit-id'))editCall(b.dataset.editId);
      if(b.hasAttribute('data-delete-id'))deleteCall(b.dataset.deleteId).catch(reportError);
    });
    $('#calls-body').addEventListener('dblclick',event=>{
      const b=event.target.closest('[data-status-id]');if(b)editStatus(b.dataset.statusId,b);
    });
    $('#logout-btn').onclick=async()=>{lockPortal();try{await auth.signOut();}catch(error){reportError(error);}};
    fillSchools();sortActivities();resetForm();
    }

    const template=$('#portal-template'); template.remove();
    let activeUid=null, generation=0;
    function sessionReady(){return !!activeUid && auth.currentUser?.uid===activeUid && !!$('#call-form');}
    function lockPortal(){
      generation++;activeUid=null;calls=[];editId=null;
      $('#app-root').replaceChildren();$('#auth-screen').style.display='grid';
      $('#login-password').value='';
    }
    function reportError(error){
      console.error('Operação não concluída:',error.code||'erro');
      if(error.code==='permission-denied'||error.code==='unauthenticated'){
        lockPortal();$('#auth-error').textContent='Acesso não autorizado. Confira o usuário e as regras do Firestore.';
      }else if(!sessionReady()){
        $('#auth-error').textContent='Não foi possível acessar o portal. Verifique a conexão e tente novamente.';
      }else alert('Não foi possível concluir a operação. Verifique a conexão e tente novamente.');
    }
    async function save(call){
      if(!sessionReady())throw new Error('Login necessário');
      const version=generation;
      await callsRef.doc(String(call.id)).set({...call,id:String(call.id)});
      if(version!==generation||!sessionReady())return false;
      const i=calls.findIndex(c=>c.id===call.id);
      if(i<0)calls.push(call);else calls[i]=call;
      render();return true;
    }
    async function commitStatus(id,select){
      if(!sessionReady())return;
      const current=calls.find(x=>x.id===id);if(!current)return;
      try{await save({...current,status:select.value});}catch(error){reportError(error);if(sessionReady())render();}
    }
    async function deleteCall(id){
      if(!sessionReady()||!confirm('Excluir este chamado?'))return;
      const version=generation;
      await callsRef.doc(String(id)).delete();
      if(version!==generation||!sessionReady())return;
      calls=calls.filter(c=>c.id!==id);render();
    }
    async function start(){
      // Credenciais precisam ser informadas novamente ao abrir/recarregar a página.
      await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
      await auth.signOut();
      auth.onAuthStateChanged(async user=>{
        lockPortal(); const version=generation;
        if(!user)return;
        try{
          // Sem fallback offline: o servidor deve autorizar a leitura antes de montar o painel.
          const snapshot=await callsRef.orderBy('date','desc').get({source:'server'});
          if(version!==generation||auth.currentUser?.uid!==user.uid)return;
          calls=snapshot.docs.map(item=>({...item.data(),id:item.id}));
          $('#app-root').replaceChildren(template.content.cloneNode(true));
          activeUid=user.uid;bindPortal();$('#user-email').textContent=user.email;
          render();$('#auth-screen').style.display='none';
        }catch(error){if(version===generation){lockPortal();reportError(error);}}
      });
      $('#login-form').onsubmit=async e=>{
        e.preventDefault();$('#auth-error').textContent='';
        const button=e.submitter||$('#login-form button');button.disabled=true;
        try{await auth.signInWithEmailAndPassword(resolveLogin($('#login-email').value),$('#login-password').value);}
        catch(error){$('#auth-error').textContent='Usuário ou senha inválidos, ou serviço indisponível.';}
        finally{$('#login-password').value='';button.disabled=false;}
      };
    }
    start().catch(error=>{lockPortal();reportError(error);});
  })();
  </script>
</body>
</html>
